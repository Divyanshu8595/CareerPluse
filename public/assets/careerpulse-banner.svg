<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#FFFFFF" />
      <stop offset="50%" stopColor="#F8FAFC" />
      <stop offset="100%" stopColor="#F1F5F9" />
    </linearGradient>

    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" floodColor="#0F172A" floodOpacity="0.06" />
    </filter>

    <style>
      .title { font-family: Georgia, 'Times New Roman', serif; font-weight: 700; fill: #0F172A; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 500; fill: #475569; }
      .mono { font-family: 'JetBrains Mono', 'Courier New', monospace; font-weight: 700; }
      .pulse-dot { animation: pulse 2.4s infinite ease-in-out; }
      .float-card-1 { animation: float1 5s infinite ease-in-out; }
      .float-card-2 { animation: float2 6s infinite ease-in-out; }
      .bar-fill-blue { animation: growBlue 3s infinite alternate ease-in-out; }
      .bar-fill-green { animation: growGreen 3.5s infinite alternate ease-in-out; }
      @keyframes pulse {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.45; transform: scale(0.92); }
      }
      @keyframes float1 {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-7px); }
      }
      @keyframes float2 {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(6px); }
      }
      @keyframes growBlue {
        0% { width: 140px; }
        100% { width: 195px; }
      }
      @keyframes growGreen {
        0% { width: 95px; }
        100% { width: 155px; }
      }
    </style>
  </defs>

  <!-- Crisp Alabaster White Canvas -->
  <rect width="1200" height="340" rx="20" fill="url(#bgGrad)" stroke="#E2E8F0" strokeWidth="2" />

  <!-- Top 4-Color Architectural Ribbon (Blue, Red, Yellow, Green) -->
  <g>
    <rect x="2" y="2" width="299" height="8" rx="2" fill="#2563EB">
      <animate attributeName="opacity" values="1;0.82;1" dur="4s" repeatCount="indefinite" />
    </rect>
    <rect x="301" y="2" width="299" height="8" fill="#DC2626">
      <animate attributeName="opacity" values="0.85;1;0.85" dur="4s" repeatCount="indefinite" />
    </rect>
    <rect x="600" y="2" width="299" height="8" fill="#EAB308">
      <animate attributeName="opacity" values="1;0.82;1" dur="4s" repeatCount="indefinite" />
    </rect>
    <rect x="899" y="2" width="299" height="8" rx="2" fill="#16A34A">
      <animate attributeName="opacity" values="0.85;1;0.85" dur="4s" repeatCount="indefinite" />
    </rect>
  </g>

  <!-- Subtle Architectural Grid Lines -->
  <g stroke="#E2E8F0" strokeWidth="1" opacity="0.55">
    <line x1="0" y1="85" x2="1200" y2="85" strokeDasharray="4 6" />
    <line x1="0" y1="265" x2="1200" y2="265" strokeDasharray="4 6" />
    <line x1="650" y1="10" x2="650" y2="338" strokeDasharray="4 6" />
  </g>

  <!-- Left Brand Lockup & Headline -->
  <g transform="translate(60, 62)">
    <!-- 4-Quad Geometric Emblem -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="22" height="22" rx="4" fill="#2563EB" />
      <rect x="26" y="0" width="22" height="22" rx="4" fill="#DC2626" />
      <rect x="0" y="26" width="22" height="22" rx="4" fill="#EAB308" />
      <rect x="26" y="26" width="22" height="22" rx="4" fill="#16A34A" />
    </g>

    <text x="64" y="22" class="mono" fontSize="12" fill="#2563EB" letterSpacing="2">
      CAREER WORKSPACE &amp; GOOGLE CALENDAR CRM
    </text>
    <text x="64" y="46" class="title" fontSize="28">
      CareerPulse
    </text>

    <text x="0" y="102" class="title" fontSize="36" letterSpacing="-0.5">
      Organize Every Application,
    </text>
    <text x="0" y="144" class="title" fontSize="36" letterSpacing="-0.5">
      Interview &amp; Follow-Up.
    </text>

    <text x="0" y="182" class="subtitle" fontSize="15">
      Live 1P Google Calendar OAuth Sync · 8-Stage Kanban · Resume Vault · 1-Click Follow-Up Drafter
    </text>

    <!-- 4-Color Pill Tags -->
    <g transform="translate(0, 206)">
      <rect x="0" y="0" width="132" height="28" rx="6" fill="#EFF6FF" stroke="#BFDBFE" />
      <circle cx="14" cy="14" r="4" fill="#2563EB" class="pulse-dot" />
      <text x="26" y="18" class="mono" fontSize="11" fill="#1D4ED8">PIPELINE CRM</text>

      <rect x="144" y="0" width="154" height="28" rx="6" fill="#F0FDF4" stroke="#BBF7D0" />
      <circle cx="158" cy="14" r="4" fill="#16A34A" class="pulse-dot" />
      <text x="170" y="18" class="mono" fontSize="11" fill="#15803D">GOOGLE CALENDAR</text>

      <rect x="310" y="0" width="136" height="28" rx="6" fill="#FEFCE8" stroke="#FEF08A" />
      <circle cx="324" cy="14" r="4" fill="#EAB308" class="pulse-dot" />
      <text x="336" y="18" class="mono" fontSize="11" fill="#CA8A04">AUTO REMINDERS</text>

      <rect x="458" y="0" width="130" height="28" rx="6" fill="#FEF2F2" stroke="#FECACA" />
      <circle cx="472" cy="14" r="4" fill="#DC2626" class="pulse-dot" />
      <text x="484" y="18" class="mono" fontSize="11" fill="#DC2626">RESUME VAULT</text>
    </g>
  </g>

  <!-- Right Animated Preview Cards -->
  <g transform="translate(690, 42)">
    <!-- Card 1: Pipeline Velocity Card -->
    <g class="float-card-1" filter="url(#cardShadow)">
      <rect x="0" y="0" width="450" height="122" rx="14" fill="#FFFFFF" stroke="#E2E8F0" strokeWidth="1.5" />
      <rect x="0" y="0" width="450" height="4" rx="2" fill="#2563EB" />
      <text x="20" y="28" class="title" fontSize="15">Live Conversion Funnel</text>
      <text x="355" y="28" class="mono" fontSize="12" fill="#16A34A">83% RESPONSE</text>

      <!-- Animated Funnel Bars -->
      <text x="20" y="54" class="subtitle" fontSize="11">Applied</text>
      <rect x="85" y="45" width="220" height="8" rx="4" fill="#F1F5F9" />
      <rect x="85" y="45" width="180" height="8" rx="4" fill="#2563EB" class="bar-fill-blue" />

      <text x="20" y="76" class="subtitle" fontSize="11">Screening</text>
      <rect x="85" y="67" width="220" height="8" rx="4" fill="#F1F5F9" />
      <rect x="85" y="67" width="145" height="8" rx="4" fill="#EAB308" />

      <text x="20" y="98" class="subtitle" fontSize="11">Offer Stage</text>
      <rect x="85" y="89" width="220" height="8" rx="4" fill="#F1F5F9" />
      <rect x="85" y="89" width="115" height="8" rx="4" fill="#16A34A" class="bar-fill-green" />

      <!-- KPI Box inside Card -->
      <rect x="330" y="44" width="100" height="58" rx="10" fill="#F8FAFC" stroke="#E2E8F0" />
      <text x="352" y="72" class="mono" fontSize="22" fill="#0F172A">07</text>
      <text x="345" y="90" class="subtitle" fontSize="10">Active Roles</text>
    </g>

    <!-- Card 2: Google Calendar Live Event Card -->
    <g transform="translate(0, 140)" class="float-card-2" filter="url(#cardShadow)">
      <rect x="0" y="0" width="450" height="114" rx="14" fill="#FFFFFF" stroke="#E2E8F0" strokeWidth="1.5" />
      <rect x="0" y="0" width="450" height="4" rx="2" fill="#16A34A" />

      <!-- Monogram Badge -->
      <rect x="20" y="22" width="38" height="38" rx="10" fill="#EEF2FF" stroke="#C7D2FE" />
      <text x="33" y="47" class="title" fontSize="18" fill="#2563EB">S</text>

      <text x="70" y="36" class="title" fontSize="15">Stripe · System Design Interview</text>
      <text x="70" y="54" class="subtitle" fontSize="12">Senior Frontend Engineer · Elena Rostova</text>

      <!-- Synced Status Pill -->
      <rect x="20" y="72" width="178" height="26" rx="6" fill="#F0FDF4" stroke="#BBF7D0" />
      <circle cx="34" cy="85" r="4" fill="#16A34A" class="pulse-dot" />
      <text x="46" y="89" class="mono" fontSize="10" fill="#15803D">SYNCED ON GOOGLE CAL</text>

      <rect x="208" y="72" width="112" height="26" rx="6" fill="#EFF6FF" stroke="#BFDBFE" />
      <text x="222" y="89" class="mono" fontSize="10" fill="#2563EB">JOIN VIDEO ↗</text>

      <rect x="330" y="72" width="100" height="26" rx="6" fill="#FEF2F2" stroke="#FECACA" />
      <text x="342" y="89" class="mono" fontSize="10" fill="#DC2626">PREP NOTES</text>
    </g>
  </g>
</svg>
